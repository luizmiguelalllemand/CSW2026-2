<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo-classes e Pseudo-elementos</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    /* Separação clara das 2 divs */
    .caixa {
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    #musicas {
      background: #fff3e0;
      border: 3px solid #ed7d31;
    }

    #sobre {
      background: #e3f2fd;
      border: 3px solid #5b9bd5;
    }

    /* Links: pseudo-classes */
    .musica {
      display: block;
      margin: 10px 0;
      font-size: 1.3em;
      color: #333;
      text-decoration: none;
    }

    .musica:hover {
      color: green;
    }

    .musica:active {
      color: red;
    }

    .musica::before {
      content: "♬ ";
    }

    .musica::after {
      content: " ♬";
    }

    /* Extras da aula */
    #sobre p::first-letter {
      font-size: 2em;
      color: #d24726;
    }

    #sobre p::first-line {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="musicas" class="caixa">
    <h1>Minhas plataformas de música</h1>
    <a class="musica" href="https://open.spotify.com" target="_blank">Spotify</a>
    <a class="musica" href="https://www.youtube.com" target="_blank">YouTube</a>
    <a class="musica" href="https://music.amazon.com" target="_blank">Amazon Music</a>
  </div>

  <div id="sobre" class="caixa">
    <h2>Sobre este site</h2>
    <p> Este site demonstra pseudo-classes (:hover e :active) e pseudo-elementos (::before e ::after). Passe o mouse
      sobre os links acima e clique neles para ver as cores mudarem.</p>
  </div>

</body>

</html>
