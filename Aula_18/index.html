<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Calculadora</h1>
    <div>
      <input type="number" id="num1" name="num1" placeholder="0">
      <select id="operation" name="operation">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
      <input type="number" id="num2" name="num2" placeholder="0">
    </div>
    <button id="calculate2" type="button">Calcular</button>
    <p id="result"></p>
  </main>
</body>
</html>
