<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios de Flexbox</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 20px;
      background: #f4f4f4;
    }

    h2 {
      margin-bottom: 8px;
    }

    .container {
      display: flex;
      background: #ddd;
      padding: 10px;
      margin-bottom: 30px;
    }

    .item {
      padding: 20px;
      color: white;
      text-align: center;
    }

    #ex2 .item {
      flex-grow: 1;
    }

    #ex2 .item:hover {
      text-decoration: underline;
    }

    #ex2 .item:nth-child(1) {
      background: tomato;
    }

    #ex2 .item:nth-child(2) {
      background: seagreen;
    }

    #ex2 .item:nth-child(3) {
      background: steelblue;
    }

    #ex3 .item {
      flex-grow: 1;
      flex-basis: 0;
      background: gray;
    }

    #ex3 .item:nth-child(3) {
      flex-grow: 2;
      background: orange;
    }

    #ex3 .item:nth-child(3):active {
      background: purple;
    }

    #ex4 {
      justify-content: flex-end;
    }

    #ex4 .item {
      background: darkslateblue;
      margin-left: 10px;
    }
  </style>
</head>

<body>

  <h2>Exercício 1 – Contêiner flexbox simples</h2>
  <div class="container" id="ex1">
    <div class="item" style="background: teal;">Item A</div>
    <div class="item" style="background: teal;">Item B</div>
  </div>

  <h2>Exercício 2 – 3 itens com flex-grow: 1 (passe o mouse)</h2>
  <div class="container" id="ex2">
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
  </div>

  <h2>Exercício 3 – Terceiro item cresce 2x (clique nele)</h2>
  <div class="container" id="ex3">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
  </div>

  <h2>Exercício 4 - justify-content: flex-end</h2>
  <div class="container" id="ex4">
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
  </div>

</body>
